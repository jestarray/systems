<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="group" aria-labelledby="title description">
    <title id="title">Select a range of bits</title>
    <desc id="description">Choose the lowest and highest bit indices. Both endpoints are included. The default range a[0..3] selects four bits.</desc>
    <rect width="1000" height="500" fill="white"/>
    <style>
        .title {
            font-family: sans-serif;
            font-size: 32px;
            font-weight: bold;
            fill: #222;
        }

        .bit {
            font-family: monospace;
            font-size: 42px;
            font-weight: bold;
            fill: #222;
        }

        .index {
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            fill: #666;
        }

        .syntax {
            font-family: monospace;
            font-size: 42px;
            font-weight: bold;
            fill: #d22;
        }

        .caption {
            font-family: sans-serif;
            font-size: 22px;
            font-weight: bold;
            fill: #333;
        }

        .box {
            fill: white;
            stroke: #222;
            stroke-width: 3;
            rx: 10;
        }

        .selected {
            fill: #d22;
        }

        .selection {
            fill: none;
            stroke: #d22;
            stroke-width: 5;
            rx: 12;
        }
    </style>

    <!-- ===================================================== -->
    <!-- TITLE                                                 -->
    <!-- ===================================================== -->

    <text x="500" y="55" text-anchor="middle" class="title">
        A range selects several bits from the bus
    </text>


    <!-- ===================================================== -->
    <!-- 8 BIT BUS                                             -->
    <!-- ===================================================== -->

    <!-- bit 7 -->
    <rect class="box" x="90" y="110" width="90" height="90"></rect>
    <text class="bit" x="135" y="170" text-anchor="middle">1</text>
    <text class="index" x="135" y="235" text-anchor="middle">a[7]</text>

    <!-- bit 6 -->
    <rect class="box" x="195" y="110" width="90" height="90"></rect>
    <text class="bit" x="240" y="170" text-anchor="middle">0</text>
    <text class="index" x="240" y="235" text-anchor="middle">a[6]</text>

    <!-- bit 5 -->
    <rect class="box" x="300" y="110" width="90" height="90"></rect>
    <text class="bit" x="345" y="170" text-anchor="middle">1</text>
    <text class="index" x="345" y="235" text-anchor="middle">a[5]</text>

    <!-- bit 4 -->
    <rect class="box" x="405" y="110" width="90" height="90"></rect>
    <text class="bit" x="450" y="170" text-anchor="middle">0</text>
    <text class="index" x="450" y="235" text-anchor="middle">a[4]</text>

    <!-- bit 3 -->
    <rect class="box" x="510" y="110" width="90" height="90"></rect>
    <text class="bit" x="555" y="170" text-anchor="middle">1</text>
    <text class="index" x="555" y="235" text-anchor="middle">a[3]</text>

    <!-- bit 2 -->
    <rect class="box" x="615" y="110" width="90" height="90"></rect>
    <text class="bit" x="660" y="170" text-anchor="middle">0</text>
    <text class="index" x="660" y="235" text-anchor="middle">a[2]</text>

    <!-- bit 1 -->
    <rect class="box" x="720" y="110" width="90" height="90"></rect>
    <text class="bit" x="765" y="170" text-anchor="middle">1</text>
    <text class="index" x="765" y="235" text-anchor="middle">a[1]</text>

    <!-- bit 0 -->
    <rect class="box" x="825" y="110" width="90" height="90"></rect>
    <text class="bit" x="870" y="170" text-anchor="middle">0</text>
    <text class="index" x="870" y="235" text-anchor="middle">a[0]</text>


    <!-- Default selection also remains visible when scripts are unavailable. -->
    <rect id="range-selection" class="selection" x="500" y="100" width="425" height="110"/>

    <foreignObject x="130" y="267" width="740" height="80">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; justify-content: center; gap: 36px; align-items: center; padding: 8px; font: 22px sans-serif; color: #222;">
            <label for="range-low">Lowest index
                <select id="range-low" style="font: inherit; min-width: 70px; min-height: 44px; background: white; color: #222; border: 2px solid #666; border-radius: 6px;">
                    <option selected="selected">0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option>
                </select>
            </label>
            <label for="range-high">Highest index
                <select id="range-high" style="font: inherit; min-width: 70px; min-height: 44px; background: white; color: #222; border: 2px solid #666; border-radius: 6px;">
                    <option>0</option><option>1</option><option>2</option><option selected="selected">3</option><option>4</option><option>5</option><option>6</option><option>7</option>
                </select>
            </label>
        </div>
    </foreignObject>

    <text id="range-syntax" class="syntax" x="500" y="380" text-anchor="middle">a[0..3]</text>
    <text id="range-count" class="caption" x="500" y="425" text-anchor="middle" aria-live="polite">4 bits selected</text>

    <script><![CDATA[
    (() => {
        const low = document.getElementById('range-low');
        const high = document.getElementById('range-high');
        const selection = document.getElementById('range-selection');
        function updateRange(event) {
            // Keep an ascending HDL range when either endpoint crosses the other.
            if (Number(low.value) > Number(high.value)) {
                if (event.target === low) high.value = low.value;
                else low.value = high.value;
            }
            const first = Number(low.value);
            const last = Number(high.value);
            const count = last - first + 1;
            selection.setAttribute('x', 80 + (7 - last) * 105);
            selection.setAttribute('width', 110 + (last - first) * 105);
            document.getElementById('range-syntax').textContent = `a[${first}..${last}]`;
            document.getElementById('range-count').textContent =
                `${count} ${count === 1 ? 'bit' : 'bits'} selected`;
        }
        low.addEventListener('change', updateRange);
        high.addEventListener('change', updateRange);
    })();
    ]]></script>
</svg>
