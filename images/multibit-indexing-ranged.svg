<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
    <style>
        .title {
            font-family: sans-serif;
            font-size: 32px;
            font-weight: bold;
            fill: #222;
        }

        .bit {
            font-family: monospace;
            font-size: 42px;
            font-weight: bold;
            fill: #222;
        }

        .index {
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            fill: #666;
        }

        .syntax {
            font-family: monospace;
            font-size: 42px;
            font-weight: bold;
            fill: #d22;
        }

        .caption {
            font-family: sans-serif;
            font-size: 22px;
            font-weight: bold;
            fill: #333;
        }

        .box {
            fill: white;
            stroke: #222;
            stroke-width: 3;
            rx: 10;
        }

        .selected {
            fill: #d22;
        }

        .selection {
            fill: none;
            stroke: #d22;
            stroke-width: 5;
            rx: 12;
        }
    </style>

    <!-- ===================================================== -->
    <!-- TITLE                                                 -->
    <!-- ===================================================== -->

    <text x="500" y="55" text-anchor="middle" class="title">
        A range selects several bits from the bus
    </text>


    <!-- ===================================================== -->
    <!-- 8 BIT BUS                                             -->
    <!-- ===================================================== -->

    <!-- bit 7 -->
    <rect class="box" x="90" y="110" width="90" height="90"></rect>
    <text class="bit" x="135" y="170" text-anchor="middle">1</text>
    <text class="index" x="135" y="235" text-anchor="middle">a[7]</text>

    <!-- bit 6 -->
    <rect class="box" x="195" y="110" width="90" height="90"></rect>
    <text class="bit" x="240" y="170" text-anchor="middle">0</text>
    <text class="index" x="240" y="235" text-anchor="middle">a[6]</text>

    <!-- bit 5 -->
    <rect class="box" x="300" y="110" width="90" height="90"></rect>
    <text class="bit" x="345" y="170" text-anchor="middle">1</text>
    <text class="index" x="345" y="235" text-anchor="middle">a[5]</text>

    <!-- bit 4 -->
    <rect class="box" x="405" y="110" width="90" height="90"></rect>
    <text class="bit" x="450" y="170" text-anchor="middle">0</text>
    <text class="index" x="450" y="235" text-anchor="middle">a[4]</text>

    <!-- bit 3 -->
    <rect class="box" x="510" y="110" width="90" height="90"></rect>
    <text class="bit" x="555" y="170" text-anchor="middle">1</text>
    <text class="index" x="555" y="235" text-anchor="middle">a[3]</text>

    <!-- bit 2 -->
    <rect class="box" x="615" y="110" width="90" height="90"></rect>
    <text class="bit" x="660" y="170" text-anchor="middle">0</text>
    <text class="index" x="660" y="235" text-anchor="middle">a[2]</text>

    <!-- bit 1 -->
    <rect class="box" x="720" y="110" width="90" height="90"></rect>
    <text class="bit" x="765" y="170" text-anchor="middle">1</text>
    <text class="index" x="765" y="235" text-anchor="middle">a[1]</text>

    <!-- bit 0 -->
    <rect class="box" x="825" y="110" width="90" height="90"></rect>
    <text class="bit" x="870" y="170" text-anchor="middle">0</text>
    <text class="index" x="870" y="235" text-anchor="middle">a[0]</text>


    <!-- ===================================================== -->
    <!-- RANGE 0..3                                            -->
    <!-- Select a[0], a[1], a[2], a[3]                        -->
    <!-- ===================================================== -->

    <rect class="selection" x="605" y="100" width="320" height="110" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75"></animate>
    </rect>


    <!-- ===================================================== -->
    <!-- RANGE 4..6                                            -->
    <!-- Select a[4], a[5], a[6]                              -->
    <!-- ===================================================== -->

    <rect class="selection" x="185" y="100" width="320" height="110" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75"></animate>
    </rect>


    <!-- ===================================================== -->
    <!-- RANGE 1..2                                            -->
    <!-- ===================================================== -->

    <rect class="selection" x="605" y="100" width="215" height="110" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75"></animate>
    </rect>


    <!-- ===================================================== -->
    <!-- RANGE 5..7                                            -->
    <!-- ===================================================== -->

    <rect class="selection" x="80" y="100" width="320" height="110" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75"></animate>
    </rect>


    <!-- ===================================================== -->
    <!-- ANIMATED RANGE SYNTAX                                 -->
    <!-- ===================================================== -->

    <!-- White background to hide labels underneath -->
    <rect x="340" y="280" width="320" height="70" fill="white"></rect>

    <text class="syntax" x="500" y="325" text-anchor="middle" opacity="0">
        a[0..3]

        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0"></animate>
    </text>

    <text class="syntax" x="500" y="325" text-anchor="middle" opacity="0">
        a[4..6]

        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0"></animate>
    </text>

    <text class="syntax" x="500" y="325" text-anchor="middle" opacity="0">
        a[1..2]

        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0"></animate>
    </text>

    <text class="syntax" x="500" y="325" text-anchor="middle" opacity="0">
        a[5..7]

        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1"></animate>
    </text>


    <!-- ===================================================== -->
    <!-- EXPLANATION                                           -->
    <!-- ===================================================== -->

    <text class="caption" x="500" y="385" text-anchor="middle">
        Several individual bits can be treated as one smaller group
    </text>

    <text class="index" x="500" y="425" text-anchor="middle">
        a[0..3] = 4 bits    •    a[4..6] = 3 bits
    </text>

</svg>
