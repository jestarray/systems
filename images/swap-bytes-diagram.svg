<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 742" width="850" height="742" role="img" aria-labelledby="title desc">
  <title id="title">SwapBytes: exchange the two 8-bit halves of a bus</title>
  <desc id="desc">Or16 connects in[0..7] to a[8..15] and in[8..15] to a[0..7]. With b=false, the rearranged input passes through to out. Bit order within each byte is preserved.</desc>
  <style>
    .code { font-family: monospace; font-size: 19px; font-weight: bold; }
    .lbl { font-family: sans-serif; font-size: 17px; font-weight: bold; text-anchor: middle; }
    .pin-text { font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .note { font-family: sans-serif; font-size: 17px; text-anchor: middle; }
    .wire { fill: none; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .wire-thin { fill: none; stroke-width: 2; stroke-linejoin: round; }
    .box { fill: none; stroke-width: 2.5; stroke-dasharray: 8,4; }
    .gate { fill: white; stroke-width: 2.5; stroke-linejoin: round; }
    .red { stroke: #e00000; } .red-fill { fill: #e00000; }
    .blue { stroke: #0000ff; } .blue-fill { fill: #0000ff; }
    .green { stroke: #008800; } .green-fill { fill: #008800; }
    .orange-fill { fill: #b45309; }
    .black { stroke: #000; } .black-fill { fill: #000; }
  </style>
  <defs>
    <polygon id="pin" points="0,0 68,0 76,12 68,24 0,24" class="gate"/>
    <polygon id="wide-pin" points="0,0 100,0 108,12 100,24 0,24" class="gate"/>
    <path id="or-gate" d="M 0,0 Q 18,0 44,25 Q 18,50 0,50 Q 13,25 0,0 Z" class="gate"/>
  </defs>
  <rect width="850" height="742" fill="white"/>
  <rect class="box red" x="65" y="15" width="730" height="340"/>
  <text class="lbl red-fill" x="425" y="41">SwapBytes</text>
  <rect class="box blue" x="280" y="75" width="300" height="245"/>
  <text class="lbl blue-fill" x="430" y="100">Or16</text>
  <use href="#wide-pin" x="280" y="128" class="blue"/>
  <text class="pin-text blue-fill" x="330" y="145">a[8..15]</text>
  <use href="#wide-pin" x="280" y="208" class="blue"/>
  <text class="pin-text blue-fill" x="330" y="225">a[0..7]</text>
  <use href="#wide-pin" x="280" y="268" class="blue"/>
  <text class="pin-text blue-fill" x="330" y="285">b</text>
  <use href="#wide-pin" x="472" y="168" class="blue"/>
  <text class="pin-text blue-fill" x="522" y="185">out</text>
  <use href="#or-gate" x="420" y="170" class="blue"/>
  <path class="wire-thin blue" d="M 388,140 H 405 V 180 H 424 M 388,220 H 405 V 200 H 424 M 388,280 H 414 V 210 H 424 M 464,195 H 468 V 180 H 472"/>
  <use href="#pin" x="25" y="168" class="red"/>
  <text class="pin-text red-fill" x="60" y="185">in[16]</text>
  <!-- These branches select different eight-bit slices of the input bus. -->
  <path class="wire red" d="M 101,180 H 140 M 140,180 V 140 H 280 M 140,180 V 220 H 280"/>
  <circle cx="140" cy="180" r="5" class="red-fill"/>
  <text class="lbl red-fill" x="212" y="128">in[0..7]</text>
  <text class="lbl red-fill" x="212" y="245">in[8..15]</text>
  <text class="lbl black-fill" x="215" y="268">false</text>
  <path class="wire-thin black" d="M 215,280 H 280"/>
  <text class="note" x="215" y="306">16 zeros</text>
  <path class="wire red" d="M 580,180 H 760"/>
  <use href="#pin" x="760" y="168" class="red"/>
  <text class="pin-text red-fill" x="795" y="185">out[16]</text>
  <text class="note" x="425" y="340">Each selected range carries 8 bits.</text>
  <g class="code">
    <text x="205" y="407" class="black-fill">INPUT</text>
    <text x="305" y="407"><tspan class="orange-fill">10110010</tspan><tspan class="green-fill">01101100</tspan></text>
    <text x="205" y="449" class="black-fill">RESULT</text>
    <text x="305" y="449"><tspan class="green-fill">01101100</tspan><tspan class="orange-fill">10110010</tspan></text>
  </g>
  <text x="100" y="520" class="code" xml:space="preserve"><tspan class="black-fill">CHIP </tspan><tspan class="red-fill">SwapBytes</tspan><tspan class="black-fill"> {</tspan></text>
  <text x="100" y="547" class="code" xml:space="preserve"><tspan class="black-fill">    IN </tspan><tspan class="red-fill">in[16]</tspan><tspan class="black-fill">;</tspan></text>
  <text x="100" y="574" class="code" xml:space="preserve"><tspan class="black-fill">    OUT </tspan><tspan class="red-fill">out[16]</tspan><tspan class="black-fill">;</tspan></text>
  <text x="100" y="601" class="code" xml:space="preserve"><tspan class="black-fill">PARTS:</tspan></text>
  <text x="100" y="628" class="code" xml:space="preserve"><tspan class="black-fill">    </tspan><tspan class="blue-fill">Or16</tspan><tspan class="black-fill">(</tspan><tspan class="blue-fill">a[0..7]</tspan><tspan class="black-fill">=</tspan><tspan class="red-fill">in[8..15]</tspan><tspan class="black-fill">,</tspan></text>
  <text x="100" y="655" class="code" xml:space="preserve"><tspan class="black-fill">         </tspan><tspan class="blue-fill">a[8..15]</tspan><tspan class="black-fill">=</tspan><tspan class="red-fill">in[0..7]</tspan><tspan class="black-fill">,</tspan></text>
  <text x="100" y="682" class="code" xml:space="preserve"><tspan class="black-fill">         </tspan><tspan class="blue-fill">b</tspan><tspan class="black-fill">=false, </tspan><tspan class="blue-fill">out</tspan><tspan class="black-fill">=</tspan><tspan class="red-fill">out</tspan><tspan class="black-fill">);</tspan></text>
  <text x="100" y="709" class="code" xml:space="preserve"><tspan class="black-fill">}</tspan></text>
</svg>
