          <rect x="161" y="274" width="62" height="81" rx="7" fill="none" stroke="#1c242c" stroke-width="1"/>
        </g><g class="wheel" data-index="1" aria-label="Weight 100, digit 0. Click to advance to 1.">
          <!-- metal rim and cylindrical black thumb wheel -->
          <rect x="266" y="268" width="100" height="93" rx="15" fill="url(#rim)" stroke="#875a00" stroke-width="1.3"/>
          <rect x="270" y="270" width="92" height="89" rx="13" fill="url(#dial)" stroke="#101821" stroke-width="1.5"/>
          <path d="M277 276 V352 M355 276 V352" stroke="#cfd5db" stroke-opacity=".28" stroke-width="2"/>
          <!-- grippy side grooves -->
          <path d="M273 281h9 M273 293h9 M273 305h9 M273 317h9 M273 329h9 M273 341h9 M350 281h9 M350 293h9 M350 305h9 M350 317h9 M350 329h9 M350 341h9" stroke="#808b93" stroke-width="1.3" opacity=".5"/>
          <rect x="286" y="274" width="60" height="81" rx="7" fill="#0b0e13"/>
