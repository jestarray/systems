          <!-- grippy side grooves -->
          <path d="M149 281h9 M149 293h9 M149 305h9 M149 317h9 M149 329h9 M149 341h9 M226 281h9 M226 293h9 M226 305h9 M226 317h9 M226 329h9 M226 341h9" stroke="#808b93" stroke-width="1.3" opacity=".5"/>
          <rect x="162" y="274" width="60" height="81" rx="7" fill="#0b0e13"/>
