<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="group" aria-label="Decimal combination lock. Click any wheel to advance only its digit." style="user-select:none;-webkit-user-select:none">
  <title>Decimal combination lock — click individual wheels</title>
  <desc>Interactive yellow four-wheel combination padlock. Click any wheel to advance its digit independently. After 9, that wheel returns to 0 without changing other wheels.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e8edf2"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#fff193"/><stop offset=".14" stop-color="#ffda37"/>
      <stop offset=".48" stop-color="#ffc314"/><stop offset=".83" stop-color="#e9a600"/><stop offset="1" stop-color="#bf8000"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#515e67"/><stop offset=".13" stop-color="#e8eef1"/>
      <stop offset=".3" stop-color="#8e9ca5"/><stop offset=".53" stop-color="#f4f8fa"/>
      <stop offset=".7" stop-color="#687882"/><stop offset=".9" stop-color="#bdc7ce"/><stop offset="1" stop-color="#3e4b52"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#754d04"/><stop offset=".11" stop-color="#ffe37e"/><stop offset=".5" stop-color="#b47406"/><stop offset=".85" stop-color="#ffdb72"/><stop offset="1" stop-color="#794e04"/></linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#171f28"/><stop offset=".12" stop-color="#44515c"/><stop offset=".22" stop-color="#202933"/><stop offset=".5" stop-color="#10161d"/><stop offset=".78" stop-color="#222e38"/><stop offset=".92" stop-color="#49535b"/><stop offset="1" stop-color="#141b22"/></linearGradient>
    <linearGradient id="glassShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".62"/><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/></linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff79f"/><stop offset="1" stop-color="#c58000"/></linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1c2730" flood-opacity=".26"/></filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4c2e00" flood-opacity=".45"/></filter>
    <clipPath id="wheelClip0"><rect x="162" y="274" width="60" height="81" rx="6"/></clipPath>
<clipPath id="wheelClip1"><rect x="286" y="274" width="60" height="81" rx="6"/></clipPath>
<clipPath id="wheelClip2"><rect x="410" y="274" width="60" height="81" rx="6"/></clipPath>
<clipPath id="wheelClip3"><rect x="534" y="274" width="60" height="81" rx="6"/></clipPath>
  </defs>
  <style><![CDATA[
    .title {font:700 22px system-ui,sans-serif;fill:#1b2935;text-anchor:middle;}
    .subtitle {font:500 13px system-ui,sans-serif;fill:#607081;text-anchor:middle;}
    .power {font:700 14px ui-monospace,Consolas,monospace;fill:#744405;text-anchor:middle;letter-spacing:.5px;}
    .digit {font:700 53px ui-monospace,Consolas,monospace;fill:#f8fafc;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#f8fafc;stroke-width:.2;}
    .brand {font:800 12px system-ui,sans-serif;fill:#66420a;text-anchor:middle;letter-spacing:2px;}
    .readout {font:700 20px ui-monospace,Consolas,monospace;fill:#233343;text-anchor:middle;}
    .hint {font:500 13px system-ui,sans-serif;fill:#64748b;text-anchor:middle;}
    .wheel {cursor:pointer;}
    .wheel:hover .digit {fill:#fff3a1;stroke:#fff3a1;}
    .strip {transform:translateY(0);}
    .strip.rolling {animation:roll .24s cubic-bezier(.23,.72,.28,1) forwards;}
    @keyframes roll {from{transform:translateY(0)}to{transform:translateY(-66px)}}
    @media (prefers-reduced-motion: reduce) {.strip.rolling{animation-duration:.02s;}}
  ]]></style>
