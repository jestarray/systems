    <!-- tiny stamped logo / base designation -->
    <text x="380" y="390" class="brand">BASE 10  /  TEN STATES PER WHEEL</text>
    <circle cx="111" cy="298" r="7" fill="#f9d04d" stroke="#975800" stroke-width="2"/><path d="M107 298h8" stroke="#88600b" stroke-width="1.5"/>
    <circle cx="649" cy="298" r="7" fill="#f9d04d" stroke="#975800" stroke-width="2"/><path d="M645 298h8" stroke="#88600b" stroke-width="1.5"/>
