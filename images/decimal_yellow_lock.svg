          <rect x="285" y="274" width="62" height="81" rx="7" fill="none" stroke="#1c242c" stroke-width="1"/>
        </g><g class="wheel" data-index="2" aria-label="Weight 10, digit 0. Click to advance to 1.">
          <!-- metal rim and cylindrical black thumb wheel -->
