  </g>
  <text id="readout" class="readout" role="status" aria-live="polite" x="380" y="495">Decimal value: 0000</text>
  <text class="hint" x="380" y="522">CLICK A WHEEL TO ADVANCE ONLY THAT DIGIT</text>
  <script><![CDATA[
    (() => {
      const svg = document.currentScript.ownerSVGElement;
      const base = 10;
      const wheels = Array.from(svg.querySelectorAll('.wheel'), (element, i) => ({
        element,
        strip: svg.getElementById('strip' + i),
        current: svg.getElementById('digit' + i),
        next: svg.getElementById('next' + i),
        weight: Math.pow(base, 3 - i),
        value: 0,
        queued: 0,
        rolling: false
      }));
      const readout = svg.getElementById('readout');

      function display(wheel) {
        wheel.current.textContent = wheel.value;
        wheel.next.textContent = (wheel.value + 1) % base;
        wheel.element.setAttribute('aria-label', `Weight ${wheel.weight}, digit ${wheel.value}. Click to advance to ${(wheel.value + 1) % base}.`);
        const digits = wheels.map(w => w.value).join('');
        const decimal = wheels.reduce((total, w) => total + w.value * w.weight, 0);
        readout.textContent = base === 2
          ? `Binary ${digits} = Decimal ${decimal}`
          : `Decimal value: ${digits}`;
      }

      function step(wheel) {
        if (wheel.rolling || !wheel.queued) return;
        wheel.rolling = true;
        wheel.queued--;
        const nextValue = (wheel.value + 1) % base;
        wheel.next.textContent = nextValue;
        wheel.strip.classList.remove('rolling');
        void wheel.strip.getBBox();
        wheel.strip.classList.add('rolling');
        window.setTimeout(() => {
          wheel.strip.classList.remove('rolling');
          wheel.value = nextValue;
          display(wheel);
          wheel.rolling = false;
          step(wheel);
        }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 30 : 245);
      }

      wheels.forEach(wheel => {
        wheel.element.addEventListener('click', () => {
          wheel.queued++;
          step(wheel);
        });
        display(wheel);
      });
    })();
  ]]></script>
</svg>