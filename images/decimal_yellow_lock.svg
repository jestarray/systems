          <!-- grippy side grooves -->
          <path d="M521 281h9 M521 293h9 M521 305h9 M521 317h9 M521 329h9 M521 341h9 M598 281h9 M598 293h9 M598 305h9 M598 317h9 M598 329h9 M598 341h9" stroke="#808b93" stroke-width="1.3" opacity=".5"/>
          <rect x="534" y="274" width="60" height="81" rx="7" fill="#0b0e13"/>
