<g><rect x="279" y="234" width="74" height="23" rx="6" fill="#db9f05" stroke="#ffea75" stroke-opacity=".6"/><text class="power" x="316" y="250">100</text></g>
<g><rect x="403" y="234" width="74" height="23" rx="6" fill="#db9f05" stroke="#ffea75" stroke-opacity=".6"/><text class="power" x="440" y="250">10</text></g>
<g><rect x="527" y="234" width="74" height="23" rx="6" fill="#db9f05" stroke="#ffea75" stroke-opacity=".6"/><text class="power" x="564" y="250">1</text></g>
